<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>捷運與夜市地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; color: #173b45; background: #f4f7f6; }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100dvh; }
    aside { padding: 26px 18px; overflow-y: auto; border-right: 1px solid #dbe5e1; }
    h1 { margin: 0 0 24px; font-size: 22px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #dbe5e1; height: 48px; }
    thead th { color: #5f777c; font-weight: 500; height: 34px; }
    th { text-align: left; font-weight: 600; }
    td, thead th:not(:first-child) { text-align: center; width: 48px; }
    .line-name { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .all-row { background: #e7efeb; }
    .all-row th { padding-left: 8px; }
    input[type=checkbox] { accent-color: #236a58; width: 18px; height: 18px; cursor: pointer; margin: 0; vertical-align: middle; }
    input:disabled { cursor: default; opacity: .3; }
    input:focus-visible { outline: 3px solid #77b6aa; outline-offset: 4px; }
    main { position: relative; min-width: 0; min-height: 0; }
    #map { width: 100%; height: 100%; background: #dde7e2; }
    #notice { position: absolute; z-index: 1000; top: 16px; left: 16px; right: 65px; padding: 12px 16px; border-radius: 7px; background: white; box-shadow: 0 2px 12px #173b4520; font-size: 13px; }
    #notice[hidden] { display: none; }
    .popup-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
    .popup-source { color: #697d82; font-size: 11px; overflow-wrap: anywhere; margin-bottom: 10px; }
    .popup-row { font-size: 12px; margin: 5px 0; overflow-wrap: anywhere; }
    .line-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .line-badge { padding: 4px 8px; border: 1px solid #dbe5e1; border-left: 5px solid var(--line-color); border-radius: 4px; font-size: 12px; color: #173b45; background: #f4f7f6; }
    .station-label { font-family: inherit; font-weight: 600; color: #173b45; background: #ffffffed; border: 1px solid #cfdbd6; box-shadow: 0 1px 4px #173b4520; }
    details { margin-top: 12px; } summary { cursor: pointer; color: #236a58; }
    .properties { max-height: 220px; overflow: auto; }
    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; grid-template-rows: 36dvh minmax(300px, 1fr); }
      aside { padding: 16px 18px; border-right: 0; border-bottom: 1px solid #dbe5e1; }
      h1 { margin-bottom: 12px; font-size: 20px; }
      th, td { height: 42px; }
    }
  </style>
</head>
<body>
  <aside aria-label="地圖顯示選項">
    <h1>捷運與夜市地圖</h1>
    <table aria-label="各路線的站點與路線顯示開關">
      <thead><tr><th scope="col">圖層／路線</th><th scope="col">站點</th><th scope="col">路線</th></tr></thead>
      <tbody id="visibility-controls"></tbody>
    </table>
  </aside>
  <main aria-label="互動捷運地圖">
    <div id="map"></div>
    <div id="notice" role="status">正在載入地圖資料…</div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const $ = id => document.getElementById(id);
    const node = (tag, text, className) => {
      const element = document.createElement(tag);
      if (text !== undefined) element.textContent = text;
      if (className) element.className = className;
      return element;
    };
    // 依提供的路網圖統一顯示配色；來源 colour 保留在原始資料中。
    const routeColors = { BR: '#C3833B', R: '#EF1738', G: '#008659', O: '#FFB81C', BL: '#0070BD',
      Y: '#FFDB00', LB: '#70B9D0', A: '#C5BDDF', R22A: '#F3A6AE', G03A: '#D7DF21' };
    const unknownColor = '#687078', transferColor = '#333333';
    const routeNames = { BR: '文湖線', R: '淡水信義線', G: '松山新店線', O: '中和新蘆線', BL: '板南線',
      Y: '環狀線', LB: '三鶯線', A: '機場捷運', R22A: '新北投支線', G03A: '小碧潭支線' };
    const stationById = new Map();
    const marketCategories = new WeakMap();
    const marketNames = { night_markets: '夜市／美食區', market_facilities: '夜市周邊設施' };
    const marketColors = { night_markets: '#B42365', market_facilities: '#64748B' };
    function classifyMarket(feature) {
      const p = feature.properties || {};
      const name = p['name:zh-Hant'] || p['name:zh'] || p.name || '';
      const related = p.public_transport || p.bus === 'yes' || p.highway === 'bus_stop'
        || p.entrance || p.railway === 'subway_entrance' || /入口|夜市口$/.test(name);
      const market = ['marketplace', 'food_court'].includes(p.amenity)
        || (!p.amenity && !p.highway && !p.office && p.building !== 'office'
          && (['retail', 'commercial'].includes(p.landuse) || p.tourism === 'attraction'));
      return !related && market ? 'night_markets' : 'market_facilities';
    }
    const sourceId = feature => feature.id || feature.properties?.['@id'];
    const linkedStation = feature => stationById.get(sourceId(feature));
    function routeId(tags) {
      if (tags.ref === '捷運紅線 (新北投支線)') return 'R22A';
      if (tags.ref === 'G' && String(tags.name || '').includes('小碧潭')) return 'G03A';
      return tags.ref;
    }
    const isStation = feature => feature.geometry.type === 'Point'
      && (feature.properties?.public_transport === 'station' || feature.properties?.railway === 'station');
    const isRoute = feature => feature.properties?.type === 'route' && feature.properties?.route === 'subway';
    const routeMemberships = feature => (Array.isArray(feature.properties?.['@relations'])
      ? feature.properties['@relations'] : []).filter(r => r?.reltags?.type === 'route' && r.reltags.route === 'subway');
    const isStop = feature => feature.geometry.type === 'Point' && !isStation(feature)
      && routeMemberships(feature).some(r => ['stop', 'stop_entry_only', 'stop_exit_only'].includes(r.role));
    function routeColor(feature) {
      return routeColors[routeId(feature.properties || {})] || unknownColor;
    }
    function pointColor(feature) {
      const lines = stationInfo(feature).lines;
      return lines.length === 1 ? routeColors[lines[0].id] : lines.length > 1 ? transferColor : unknownColor;
    }
    const stationCodes = feature => String(feature.properties?.ref || '').toUpperCase()
      .split(/[;,\s/]+/).filter(code => /^(BR|BL|LB|R|G|O|Y|A)\d+[A-Z]?$/.test(code));
    function stationDetails(feature) {
      const p = feature.properties || {}, codes = stationCodes(feature);
      const ids = [...new Set(codes.map(code => ['R22A', 'G03A'].includes(code) ? code : code.match(/^[A-Z]+/)[0]))];
      return { name: p['name:zh-Hant'] || p['name:zh'] || p.name,
        codes, lines: ids.map(id => ({ id, name: routeNames[id] })) };
    }
    // 僅裁切顯示用的首尾座標；原始 GeoJSON、途中站與線形保持不變。
    function trimRouteGeometry(feature, stationFeatures) {
      if (!isRoute(feature)) return feature.geometry;
      const geometry = feature.geometry;
      if (!['LineString', 'MultiLineString'].includes(geometry.type)) return geometry;
      const id = routeId(feature.properties);
      const candidates = stationFeatures.filter(station => stationCodes(station).some(code => {
        if (id === 'R22A') return ['R22', 'R22A'].includes(code);
        if (id === 'G03A') return ['G03', 'G03A'].includes(code);
        return code.match(/^[A-Z]+/)?.[0] === id && !/[A-Z]$/.test(code);
      }));
      if (!candidates.length) return geometry;
      const distance = (a, b) => Math.hypot((a[0] - b[0]) * 100900, (a[1] - b[1]) * 111200);
      function trimPart(points) {
        if (distance(points[0], points[points.length - 1]) < 5) return points;
        const cumulative = [0];
        for (let i = 1; i < points.length; i++) cumulative.push(cumulative[i - 1] + distance(points[i - 1], points[i]));
        const total = cumulative[cumulative.length - 1];
        function anchor(atStart) {
          const endpoint = atStart ? points[0] : points[points.length - 1];
          const station = candidates.reduce((best, item) => distance(endpoint, item.geometry.coordinates)
            < distance(endpoint, best.geometry.coordinates) ? item : best);
          const target = station.geometry.coordinates;
          // 遠離車站的端點與過大偏移不猜測；避免裁掉不相關路段。
          if (distance(endpoint, target) > 1000) return null;
          let best = null;
          for (let i = 0; i < points.length - 1; i++) {
            const a = points[i], b = points[i + 1];
            const dx = (b[0] - a[0]) * 100900, dy = (b[1] - a[1]) * 111200;
            const squared = dx * dx + dy * dy;
            const t = squared ? Math.max(0, Math.min(1,
              ((target[0] - a[0]) * 100900 * dx + (target[1] - a[1]) * 111200 * dy) / squared)) : 0;
            const point = a.map((v, axis) => v + t * ((b[axis] ?? v) - v));
            const error = distance(point, target), along = cumulative[i] + t * Math.sqrt(squared);
            if (!best || error < best.error) best = { point, error, along, station };
          }
          const removed = atStart ? best.along : total - best.along;
          return best.error <= 150 && removed > 5 && removed <= 1000 ? best : null;
        }
        const start = anchor(true), end = anchor(false);
        if (!start && !end) return points;
        if (start && end && start.station === end.station) return points;
        const from = start?.along ?? 0, to = end?.along ?? total;
        if (to - from < total / 2) return points;
        return [start?.point || points[0],
          ...points.filter((_point, index) => cumulative[index] > from && cumulative[index] < to),
          end?.point || points[points.length - 1]];
      }
      const coordinates = geometry.type === 'LineString' ? trimPart(geometry.coordinates)
        : geometry.coordinates.map(trimPart);
      return { ...geometry, coordinates };
    }
    const featureName = (feature, info) => {
      const p = feature.properties || {};
      if (isStation(feature)) {
        const station = stationDetails(feature), name = station.name || '未提供站名的捷運站';
        return station.lines.some(line => line.id === 'A') ? `${name}（機場捷運）` : name;
      }
      const name = p['name:zh-Hant'] || p['name:zh'] || p.name;
      if (name) return name;
      const linked = linkedStation(feature);
      if (linked?.name) return `${linked.name} · ${isStop(feature) ? '停靠點' : '路線節點'}`;
      if (isStop(feature)) {
        const ids = [...new Set(routeMemberships(feature).map(r => routeId(r.reltags)))];
        const label = ids.map(id => routeNames[id]).filter(Boolean).join('／') || '捷運';
        return `${label}停靠點（站名未提供）`;
      }
      if (feature.geometry.type === 'Point' && routeMemberships(feature).length) return '路線節點（用途未提供）';
      if (routeNames[p.ref]) return `${routeNames[p.ref]}軌道`;
      if (['LineString', 'MultiLineString'].includes(feature.geometry.type)) return '未命名軌道路段';
      if (['Polygon', 'MultiPolygon'].includes(feature.geometry.type)) return '未命名設施範圍';
      return '未提供名稱的地圖資料';
    };
    const displayValue = value => typeof value === 'boolean' ? (value ? '有' : '無')
      : typeof value === 'object' ? JSON.stringify(value) : String(value);
    function stationInfo(feature) {
      if (isStation(feature)) return stationDetails(feature);
      const p = feature.properties || {};
      const ids = [...new Set([routeId(p), ...routeMemberships(feature).map(r => routeId(r.reltags))])];
      const linked = linkedStation(feature);
      return { name: linked?.name, codes: linked?.codes || [],
        lines: ids.filter(id => routeNames[id]).map(id => ({ id, name: routeNames[id] })) };
    }
    function displayLineIds(feature) {
      if (marketCategories.has(feature)) return [marketCategories.get(feature)];
      const ids = stationInfo(feature).lines.map(line => line.id);
      if (isStation(feature)) {
        const codes = stationCodes(feature);
        if (codes.includes('R22')) ids.push('R22A');
        if (codes.includes('G03')) ids.push('G03A');
      }
      return ids.length ? [...new Set(ids)] : ['other'];
    }
    function popup(feature, info, station) {
      const p = feature.properties || {}, box = node('div');
      box.append(node('div', featureName(feature, info), 'popup-title'), node('div', info.id, 'popup-source'));
      if (sourceId(feature)) box.append(node('div', `來源物件：${sourceId(feature)}`, 'popup-row'));
      if (station.name) box.append(node('div', `車站：${station.name}`, 'popup-row'));
      const marketCategory = marketCategories.get(feature);
      if (marketCategory) {
        box.append(node('div', `分類：${marketNames[marketCategory]}（依來源標籤）`, 'popup-row'));
      } else if (station.lines.length) {
        box.append(node('div', '所屬路線（依現有資料）', 'popup-row'));
        const badges = node('div', undefined, 'line-badges');
        for (const line of station.lines) {
          const badge = node('span', `${line.id} ${line.name}`, 'line-badge');
          badge.style.setProperty('--line-color', routeColors[line.id] || unknownColor);
          badges.append(badge);
        }
        box.append(badges);
      } else {
        box.append(node('div', '未分類：來源缺少可辨識的站碼或所屬路線。', 'popup-row'));
        if (isStation(feature) && !station.name) box.append(node('div', '來源也未提供站名，保留原始資料供核對。', 'popup-row'));
      }
      if (p['@geometry'] === 'center') {
        box.append(node('div', '座標為原始物件匯出的範圍中心。', 'popup-row'));
      }
      const fields = { ref: isStation(feature) ? '車站代碼' : '來源代碼',
        from: '路線起點', to: '路線終點', direction: '方向（來源標記）',
        operator: '營運單位（來源標記）', 'addr:full': '地址', wheelchair: '輪椅通行（來源標記）',
        access: '通行限制', network: '路網', service: '軌道用途', construction: '施工標記', UpdateTime: '資料更新時間',
        opening_hours: '營業時間（來源標記）', description: '說明', phone: '電話', branch: '分區',
        amenity: '設施類型（來源標記）', highway: '道路／站點類型（來源標記）' };
      for (const [key, label] of Object.entries(fields)) {
        if (p[key] !== undefined && p[key] !== null) box.append(node('div', `${label}：${displayValue(p[key])}`, 'popup-row'));
      }
      if (!isStation(feature) && linkedStation(feature)?.name) {
        box.append(node('div', `車站代碼：${station.codes.join('、')}（依相同來源節點 ID 對照）`, 'popup-row'));
      } else if (isStop(feature)) box.append(node('div', '這是路線停靠位置；來源未提供此點的站名或站碼。', 'popup-row'));
      const memberships = routeMemberships(feature);
      if (memberships.length) {
        box.append(node('div', '所屬方向路線', 'popup-row'));
        for (const relation of memberships) {
          const tags = relation.reltags;
          const name = tags['name:zh-Hant'] || tags['name:zh'] || tags.name || `路線 ${relation.rel}`;
          box.append(node('div', name, 'popup-row'));
          const roles = { stop: '停靠點', stop_entry_only: '僅上車停靠點', stop_exit_only: '僅下車停靠點' };
          box.append(node('div', `節點／成員用途：${roles[relation.role] || relation.role || '來源未提供'}`, 'popup-row'));
          if (tags.from || tags.to) box.append(node('div', `${tags.from || '未提供起點'} → ${tags.to || '未提供終點'}`, 'popup-row'));
        }
      }
      if (feature.geometry.type === 'Point') {
        const [lon, lat] = feature.geometry.coordinates;
        box.append(node('div', `經緯度：${lat.toFixed(6)}, ${lon.toFixed(6)}`, 'popup-row'));
      }
      const details = node('details'), props = node('div', undefined, 'properties');
      details.append(node('summary', '查看全部來源欄位'));
      for (const [key, value] of Object.entries(p)) props.append(node('div', `${key}：${displayValue(value)}`, 'popup-row'));
      details.append(props); box.append(details);
      return box;
    }
    async function fetchJSON(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }
    async function start() {
      if (location.protocol === 'file:') throw new Error('請執行 python mrt_map.py，透過終端機顯示的網址開啟地圖。');
      if (!window.L) throw new Error('無法載入地圖元件，請確認網路連線後重新整理。');
      const map = L.map('map', { zoomControl: false }).setView([25.04, 121.4], 10);
      L.control.zoom({ position: 'topright' }).addTo(map);
      L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map);
      map.createPane('points').style.zIndex = 450;
      map.createPane('stations').style.zIndex = 470;
      map.createPane('markets').style.zIndex = 480;
      map.createPane('routes').style.zIndex = 410;
      let tileFailed = false;
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).on('tileerror', () => {
        tileFailed = true; $('notice').hidden = false;
        $('notice').textContent = '街道底圖載入失敗，請檢查網路連線；資料圖層仍可查看。';
      }).addTo(map);
      const { layers } = await fetchJSON('/layers.json');
      const loaded = await Promise.all(layers.map(async info => {
        if (info.error) return { info };
        try { return { info, data: await fetchJSON(info.url) }; }
        catch (error) { return { info: { ...info, error: `載入失敗：${error.message}` } }; }
      }));
      const stationFeatures = loaded.flatMap(({ data }) => (data?.features || []).filter(isStation));
      for (const { info, data } of loaded) {
        if (info.id.split('/').pop().toLowerCase() === 'nightmarket.geojson') {
          for (const feature of data?.features || []) marketCategories.set(feature, classifyMarket(feature));
        }
      }
      stationById.clear();
      for (const { data } of loaded) {
        for (const feature of data?.features || []) {
          if (isStation(feature) && sourceId(feature)) stationById.set(sourceId(feature), stationDetails(feature));
        }
      }
      const entries = [], stationMarkers = [], allBounds = L.latLngBounds();
      const controls = new Map(), masterControls = {};
      function syncLabels() {
        for (const marker of stationMarkers) {
          if (map.getZoom() >= 14 && map.hasLayer(marker)) marker.openTooltip();
          else marker.closeTooltip();
        }
      }
      map.on('zoomend', syncLabels);
      for (const { info, data } of loaded) {
        if (!data) continue;
        const group = L.geoJSON(data, {
          style: feature => {
            if (['Point', 'MultiPoint'].includes(feature.geometry.type)) return {};
            if (marketCategories.has(feature)) return { color: marketColors[marketCategories.get(feature)],
              weight: 3, opacity: 1, fillOpacity: .2, className: 'market-shape' };
            if (isRoute(feature)) return { pane: 'routes', color: routeColor(feature), weight: 7,
              opacity: 1, className: 'data-shape route-shape' };
            const p = feature.properties || {};
            return { color: routeColor(feature), weight: p.service ? 2 : 4,
              opacity: 1, fillOpacity: .17, dashArray: p.service ? '5 5' : null, className: 'data-shape' };
          },
          pointToLayer: (feature, latlng) => {
            const category = marketCategories.get(feature);
            if (category) return L.circleMarker(latlng, { pane: 'markets',
              radius: category === 'night_markets' ? 8 : 5, color: '#fff', weight: 2,
              fillColor: marketColors[category], fillOpacity: 1,
              className: category === 'night_markets' ? 'night-market-point' : 'market-facility-point' });
            if (isStation(feature)) {
              return L.circleMarker(latlng, { pane: 'stations', radius: 8, weight: 3,
                color: pointColor(feature),
                fillColor: '#fff', fillOpacity: 1, className: 'station-point' });
            }
            return L.circleMarker(latlng, { pane: 'points', radius: isStop(feature) ? 4 : 6,
              color: '#fff', weight: 1.5, fillColor: pointColor(feature), fillOpacity: 1,
              className: isStop(feature) ? 'data-point stop-point' : 'data-point' });
          },
          onEachFeature: (feature, layer) => {
            if (isRoute(feature) && layer.setLatLngs) {
              const geometry = trimRouteGeometry(feature, stationFeatures);
              layer.setLatLngs(L.GeoJSON.coordsToLatLngs(geometry.coordinates, geometry.type === 'MultiLineString' ? 1 : 0));
            }
            layer.bindPopup(popup(feature, info, stationInfo(feature)), { maxWidth: 330 });
            if (isStation(feature) || marketCategories.get(feature) === 'night_markets') {
              layer.bindTooltip(node('span', [featureName(feature, info), feature.properties.ref].filter(Boolean).join(' · ')),
                { permanent: true, direction: 'right', offset: [10, 0], className: 'station-label' });
              stationMarkers.push(layer);
            }
            entries.push({ layer, ids: displayLineIds(feature),
              kind: ['Point', 'MultiPoint'].includes(feature.geometry.type) ? 'points' : 'routes' });
          }
        });
        if (group.getBounds().isValid()) allBounds.extend(group.getBounds());
      }
      function syncVisibility() {
        for (const entry of entries) {
          const visible = entry.ids.some(id => controls.get(id)?.[entry.kind]?.checked);
          if (visible && !map.hasLayer(entry.layer)) entry.layer.addTo(map);
          else if (!visible && map.hasLayer(entry.layer)) map.removeLayer(entry.layer);
        }
        for (const kind of ['points', 'routes']) {
          const boxes = [...controls.values()].map(row => row[kind]).filter(box => !box.disabled);
          const checked = boxes.filter(box => box.checked).length;
          masterControls[kind].checked = boxes.length > 0 && checked === boxes.length;
          masterControls[kind].indeterminate = checked > 0 && checked < boxes.length;
          masterControls[kind].disabled = !boxes.length;
        }
        syncLabels();
      }
      function addRow(id, name, master = false) {
        const row = node('tr'), heading = node('th'), title = node('span', undefined, 'line-name');
        heading.scope = 'row';
        if (master) row.className = 'all-row';
        else {
          const swatch = node('span', undefined, 'swatch');
          swatch.style.background = routeColors[id] || marketColors[id] || unknownColor; title.append(swatch);
        }
        title.append(node('span', name)); heading.append(title); row.append(heading);
        const boxes = {};
        for (const [kind, label] of [['points', '站點'], ['routes', '路線']]) {
          const cell = node('td'), box = node('input'); box.type = 'checkbox';
          box.dataset.line = id; box.dataset.kind = kind;
          box.setAttribute('aria-label', `${name}：顯示${label}`);
          box.disabled = !master && !entries.some(entry => entry.kind === kind && entry.ids.includes(id));
          box.checked = !box.disabled && id !== 'market_facilities'; boxes[kind] = box; cell.append(box); row.append(cell);
          box.addEventListener('change', () => {
            if (master) for (const control of controls.values()) if (!control[kind].disabled) control[kind].checked = box.checked;
            syncVisibility();
          });
        }
        $('visibility-controls').append(row);
        if (master) Object.assign(masterControls, boxes);
        else controls.set(id, boxes);
      }
      addRow('all', '全部', true);
      const present = new Set(entries.flatMap(entry => entry.ids));
      for (const id of ['BR', 'R', 'R22A', 'G', 'G03A', 'O', 'BL', 'Y', 'LB', 'A', 'night_markets', 'market_facilities', 'other']) {
        if (present.has(id)) addRow(id, routeNames[id] || marketNames[id] || '未分類');
      }
      syncVisibility();
      if (allBounds.isValid()) map.fitBounds(allBounds, { padding: [30, 30], animate: false });
      syncLabels();
      const failures = loaded.filter(item => item.info.error);
      if (failures.length) {
        $('notice').hidden = false;
        $('notice').textContent = failures.map(item => `${item.info.name}：${item.info.error}`).join('；');
      } else if (!entries.length) {
        $('notice').hidden = false; $('notice').textContent = '沒有可顯示的資料，請確認 data 資料夾後重新啟動程式。';
      } else if (!tileFailed) $('notice').hidden = true;
      document.body.dataset.ready = 'true';
    }
    start().catch(error => { $('notice').hidden = false; $('notice').textContent = `地圖載入失敗：${error.message}`; });
  </script>
</body>
</html>
