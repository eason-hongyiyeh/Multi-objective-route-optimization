<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>捷運、夜市與景點地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; color: #173b45; background: #f4f7f6; }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-columns: var(--sidebar-width, 290px) 8px minmax(0, 1fr); height: 100dvh; overflow: hidden; }
    body.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
    aside { padding: 26px 18px; min-width: 0; min-height: 0; overflow-y: auto; }
    [hidden] { display: none !important; }
    #sidebar-resizer { position: relative; background: #e1e9e5; cursor: col-resize; touch-action: none; }
    #sidebar-resizer::after { content: ''; position: absolute; left: 3px; top: calc(50% - 22px); width: 2px; height: 44px; border-radius: 2px; background: #7e9a90; }
    #sidebar-resizer:hover, #sidebar-resizer:focus-visible, .sidebar-resizing #sidebar-resizer { background: #a9ccc0; }
    #sidebar-resizer:focus-visible { outline: 2px solid #236a58; outline-offset: -2px; }
    body.sidebar-resizing { cursor: col-resize; user-select: none; }
    .sidebar-resizing #map { pointer-events: none; }
    #sidebar-toggle { position: absolute; z-index: 1000; top: 12px; left: 12px; padding: 8px 12px; border: 1px solid #b7c9c2; border-radius: 5px; background: white; color: #173b45; font: inherit; font-size: 13px; cursor: pointer; box-shadow: 0 1px 5px #173b4520; }
    #sidebar-toggle:focus-visible { outline: 3px solid #77b6aa; outline-offset: 2px; }
    h1 { margin: 0 0 24px; font-size: 22px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #dbe5e1; height: 48px; }
    thead th { color: #5f777c; font-weight: 500; height: 34px; }
    th { text-align: left; font-weight: 600; }
    td, thead th:not(:first-child) { text-align: center; width: 48px; }
    .line-name { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .all-row { background: #e7efeb; }
    .all-row th { padding-left: 8px; }
    input[type=checkbox] { accent-color: #236a58; width: 18px; height: 18px; cursor: pointer; margin: 0; vertical-align: middle; }
    input:disabled { cursor: default; opacity: .3; }
    input:focus-visible { outline: 3px solid #77b6aa; outline-offset: 4px; }
    main { position: relative; min-width: 0; min-height: 0; }
    #map { width: 100%; height: 100%; background: #dde7e2; }
    #notice { position: absolute; z-index: 1000; top: 60px; left: 16px; right: 65px; padding: 12px 16px; border-radius: 7px; background: white; box-shadow: 0 2px 12px #173b4520; font-size: 13px; }
    #notice[hidden] { display: none; }
    .popup-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
    .popup-source { color: #697d82; font-size: 11px; overflow-wrap: anywhere; margin-bottom: 10px; }
    .popup-row { font-size: 12px; margin: 5px 0; overflow-wrap: anywhere; }
    .attraction-popup .popup-row { white-space: pre-line; }
    .walk-button { border: 1px solid #B42365; border-radius: 4px; padding: 6px 9px; margin: 6px 6px 4px 0; background: white; color: #95144f; cursor: pointer; }
    .walking-hint { color: #5f777c; font-size: 12px; line-height: 1.7; }
    .line-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .line-badge { padding: 4px 8px; border: 1px solid #dbe5e1; border-left: 5px solid var(--line-color); border-radius: 4px; font-size: 12px; color: #173b45; background: #f4f7f6; }
    .station-label { font-family: inherit; font-weight: 600; color: #173b45; background: #ffffffed; border: 1px solid #cfdbd6; box-shadow: 0 1px 4px #173b4520; }
    details { margin-top: 12px; } summary { cursor: pointer; color: #236a58; }
    .properties { max-height: 220px; overflow: auto; }
    @media (max-width: 700px) {
      body { grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--sidebar-height, 36dvh) 8px minmax(0, 1fr); }
      body.sidebar-collapsed { grid-template-rows: minmax(0, 1fr); }
      aside { padding: 16px 18px; }
      #sidebar-resizer, body.sidebar-resizing { cursor: row-resize; }
      #sidebar-resizer::after { left: calc(50% - 22px); top: 3px; width: 44px; height: 2px; }
      h1 { margin-bottom: 12px; font-size: 20px; }
      th, td { height: 42px; }
    }
  </style>
</head>
<body>
  <aside id="sidebar" aria-label="地圖顯示選項">
    <h1>捷運、夜市與景點地圖</h1>
    <table aria-label="各路線的站點與路線顯示開關">
      <thead><tr><th scope="col">圖層／路線</th><th scope="col">站點</th><th scope="col">路線</th></tr></thead>
      <tbody id="visibility-controls"></tbody>
    </table>
    <p id="walking-hint" class="walking-hint" role="status"></p>
  </aside>
  <div id="sidebar-resizer" role="separator" tabindex="0" aria-label="調整列表大小"
    aria-controls="sidebar" aria-orientation="vertical" title="拖曳調整列表大小，連按兩下恢復預設"></div>
  <main aria-label="互動捷運地圖">
    <div id="map"></div>
    <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true">收合列表</button>
    <div id="notice" role="status">正在載入地圖資料…</div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const $ = id => document.getElementById(id);
    const node = (tag, text, className) => {
      const element = document.createElement(tag);
      if (text !== undefined) element.textContent = text;
      if (className) element.className = className;
      return element;
    };
    // 依提供的路網圖統一顯示配色；來源 colour 保留在原始資料中。
    const routeColors = { BR: '#C3833B', R: '#EF1738', G: '#008659', O: '#FFB81C', BL: '#0070BD',
      Y: '#FFDB00', LB: '#70B9D0', A: '#C5BDDF', R22A: '#F3A6AE', G03A: '#D7DF21' };
    const unknownColor = '#687078', transferColor = '#333333';
    const routeNames = { BR: '文湖線', R: '淡水信義線', G: '松山新店線', O: '中和新蘆線', BL: '板南線',
      Y: '環狀線', LB: '三鶯線', A: '機場捷運', R22A: '新北投支線', G03A: '小碧潭支線' };
    const stationById = new Map();
    const nightMarkets = new WeakSet();
    const attractions = new WeakSet();
    const attractionNames = { attractions: '景點' };
    const attractionColors = { attractions: '#0F766E' };
    const exitGroups = new WeakMap();
    const exitNames = { mrt_exits: '捷運出入口', airport_exits: '機場捷運出入口' };
    const exitColors = { mrt_exits: '#0075BE', airport_exits: '#8851B0' };
    const exitGroup = feature => exitGroups.get(feature)
      || (feature.properties?.railway === 'subway_entrance' ? 'mrt_exits' : null);
    const walkingById = new Map();
    const calculatedWalkingOrigins = new Set();
    let walkingStatus = '';
    const marketNames = { night_markets: '夜市' };
    const marketColors = { night_markets: '#B42365' };
    const walkingColor = '#B42365';
    const sourceId = feature => feature.id || feature.properties?.['@id'] || feature.properties?.ExitID;
    const linkedStation = feature => stationById.get(sourceId(feature));
    function routeId(tags) {
      if (tags.ref === '捷運紅線 (新北投支線)') return 'R22A';
      if (tags.ref === 'G' && String(tags.name || '').includes('小碧潭')) return 'G03A';
      return tags.ref;
    }
    const isStation = feature => feature.geometry.type === 'Point'
      && (feature.properties?.public_transport === 'station' || feature.properties?.railway === 'station');
    const isRoute = feature => feature.properties?.type === 'route' && feature.properties?.route === 'subway';
    const routeMemberships = feature => (Array.isArray(feature.properties?.['@relations'])
      ? feature.properties['@relations'] : []).filter(r => r?.reltags?.type === 'route' && r.reltags.route === 'subway');
    const isStop = feature => feature.geometry.type === 'Point' && !isStation(feature)
      && routeMemberships(feature).some(r => ['stop', 'stop_entry_only', 'stop_exit_only'].includes(r.role));
    function routeColor(feature) {
      return routeColors[routeId(feature.properties || {})] || unknownColor;
    }
    function pointColor(feature) {
      const lines = stationInfo(feature).lines;
      return lines.length === 1 ? routeColors[lines[0].id] : lines.length > 1 ? transferColor : unknownColor;
    }
    const stationCodes = feature => String(feature.properties?.ref || '').toUpperCase()
      .split(/[;,\s/]+/).filter(code => /^(BR|BL|LB|R|G|O|Y|A)\d+[A-Z]?$/.test(code));
    function stationDetails(feature) {
      const p = feature.properties || {}, codes = stationCodes(feature);
      const ids = [...new Set(codes.map(code => ['R22A', 'G03A'].includes(code) ? code : code.match(/^[A-Z]+/)[0]))];
      return { name: p['name:zh-Hant'] || p['name:zh'] || p.name,
        codes, lines: ids.map(id => ({ id, name: routeNames[id] })) };
    }
    // 僅裁切顯示用的首尾座標；原始 GeoJSON、途中站與線形保持不變。
    function trimRouteGeometry(feature, stationFeatures) {
      if (!isRoute(feature)) return feature.geometry;
      const geometry = feature.geometry;
      if (!['LineString', 'MultiLineString'].includes(geometry.type)) return geometry;
      const id = routeId(feature.properties);
      const candidates = stationFeatures.filter(station => stationCodes(station).some(code => {
        if (id === 'R22A') return ['R22', 'R22A'].includes(code);
        if (id === 'G03A') return ['G03', 'G03A'].includes(code);
        return code.match(/^[A-Z]+/)?.[0] === id && !/[A-Z]$/.test(code);
      }));
      if (!candidates.length) return geometry;
      const distance = (a, b) => Math.hypot((a[0] - b[0]) * 100900, (a[1] - b[1]) * 111200);
      function trimPart(points) {
        if (distance(points[0], points[points.length - 1]) < 5) return points;
        const cumulative = [0];
        for (let i = 1; i < points.length; i++) cumulative.push(cumulative[i - 1] + distance(points[i - 1], points[i]));
        const total = cumulative[cumulative.length - 1];
        function anchor(atStart) {
          const endpoint = atStart ? points[0] : points[points.length - 1];
          const station = candidates.reduce((best, item) => distance(endpoint, item.geometry.coordinates)
            < distance(endpoint, best.geometry.coordinates) ? item : best);
          const target = station.geometry.coordinates;
          // 遠離車站的端點與過大偏移不猜測；避免裁掉不相關路段。
          if (distance(endpoint, target) > 1000) return null;
          let best = null;
          for (let i = 0; i < points.length - 1; i++) {
            const a = points[i], b = points[i + 1];
            const dx = (b[0] - a[0]) * 100900, dy = (b[1] - a[1]) * 111200;
            const squared = dx * dx + dy * dy;
            const t = squared ? Math.max(0, Math.min(1,
              ((target[0] - a[0]) * 100900 * dx + (target[1] - a[1]) * 111200 * dy) / squared)) : 0;
            const point = a.map((v, axis) => v + t * ((b[axis] ?? v) - v));
            const error = distance(point, target), along = cumulative[i] + t * Math.sqrt(squared);
            if (!best || error < best.error) best = { point, error, along, station };
          }
          const removed = atStart ? best.along : total - best.along;
          return best.error <= 150 && removed > 5 && removed <= 1000 ? best : null;
        }
        const start = anchor(true), end = anchor(false);
        if (!start && !end) return points;
        if (start && end && start.station === end.station) return points;
        const from = start?.along ?? 0, to = end?.along ?? total;
        if (to - from < total / 2) return points;
        return [start?.point || points[0],
          ...points.filter((_point, index) => cumulative[index] > from && cumulative[index] < to),
          end?.point || points[points.length - 1]];
      }
      const coordinates = geometry.type === 'LineString' ? trimPart(geometry.coordinates)
        : geometry.coordinates.map(trimPart);
      return { ...geometry, coordinates };
    }
    const featureName = (feature, info) => {
      const p = feature.properties || {};
      if (attractions.has(feature)) return p.AttractionName || '未提供名稱的景點';
      if (exitGroup(feature) === 'airport_exits') {
        const exitName = String(p.ExitName_zh || p.ExitID || (p.ref ? `出入口 ${p.ref}` : '出入口（編號未提供）')).replace(/^出口/, '出入口');
        return `${p.StationName_zh || p.station_name || p.StationID || p.station_ref || '站名未提供'} · 機場捷運${exitName}`;
      }
      if (exitGroup(feature)) {
        if (p.station_name) return `${p.station_name} · 捷運出入口 ${p.ref || '（編號未提供）'}`;
        const name = p['name:zh-Hant'] || p['name:zh'] || p.name;
        return name ? `捷運出入口 · ${name}` : `捷運出入口 ${p.ref || '（編號未提供）'}`;
      }
      if (isStation(feature)) {
        const station = stationDetails(feature), name = station.name || '未提供站名的捷運站';
        return station.lines.some(line => line.id === 'A') ? `${name}（機場捷運）` : name;
      }
      const name = p['name:zh-Hant'] || p['name:zh'] || p.name;
      if (name) return name;
      const linked = linkedStation(feature);
      if (linked?.name) return `${linked.name} · ${isStop(feature) ? '停靠點' : '路線節點'}`;
      if (isStop(feature)) {
        const ids = [...new Set(routeMemberships(feature).map(r => routeId(r.reltags)))];
        const label = ids.map(id => routeNames[id]).filter(Boolean).join('／') || '捷運';
        return `${label}停靠點（站名未提供）`;
      }
      if (feature.geometry.type === 'Point' && routeMemberships(feature).length) return '路線節點（用途未提供）';
      if (routeNames[p.ref]) return `${routeNames[p.ref]}軌道`;
      if (['LineString', 'MultiLineString'].includes(feature.geometry.type)) return '未命名軌道路段';
      if (['Polygon', 'MultiPolygon'].includes(feature.geometry.type)) return '未命名設施範圍';
      return '未提供名稱的地圖資料';
    };
    const displayValue = value => typeof value === 'boolean' ? (value ? '有' : '無')
      : typeof value === 'object' ? JSON.stringify(value) : String(value);
    function stationInfo(feature) {
      if (isStation(feature)) return stationDetails(feature);
      const p = feature.properties || {};
      if (exitGroup(feature) === 'airport_exits') return { name: p.StationName_zh || p.station_name,
        codes: [p.StationID || p.station_ref].filter(Boolean), lines: [{ id: 'A', name: routeNames.A }] };
      if (exitGroup(feature) && p.station_name) {
        const code = String(p.station_ref || ''), id = code.match(/^[A-Z]+/)?.[0];
        return { name: p.station_name, codes: code ? [code] : [],
          lines: routeNames[id] ? [{ id, name: routeNames[id] }] : [] };
      }
      const ids = [...new Set([routeId(p), ...routeMemberships(feature).map(r => routeId(r.reltags))])];
      const linked = linkedStation(feature);
      return { name: linked?.name, codes: linked?.codes || [],
        lines: ids.filter(id => routeNames[id]).map(id => ({ id, name: routeNames[id] })) };
    }
    function displayLineIds(feature) {
      if (attractions.has(feature)) return ['attractions'];
      if (nightMarkets.has(feature)) return ['night_markets'];
      if (exitGroup(feature)) return [exitGroup(feature)];
      const ids = stationInfo(feature).lines.map(line => line.id);
      if (isStation(feature)) {
        const codes = stationCodes(feature);
        if (codes.includes('R22')) ids.push('R22A');
        if (codes.includes('G03')) ids.push('G03A');
      }
      return ids.length ? [...new Set(ids)] : ['other'];
    }
    function appendWalkingDetails(box, walk) {
      const seconds = Math.round(walk.duration_s);
      box.append(node('div', `20 分鐘內最近的捷運站：${walk.station_name}（${walk.station_code}）`, 'popup-row'),
        node('div', `步行路徑：${walk.distance_m.toLocaleString()} 公尺`, 'popup-row'),
        node('div', `步行時間：${Math.floor(seconds / 60)} 分 ${seconds % 60} 秒（每秒 1 公尺）`, 'popup-row'),
        node('div', '終點為車站位置，尚未指定出口。依可步行道路估算，不含等紅綠燈、點位偏移與站內步行。', 'popup-row'));
      if (walk.note) box.append(node('div', walk.note, 'popup-row'));
    }
    function popup(feature, info, station, showWalking) {
      const p = feature.properties || {}, box = node('div');
      box.append(node('div', featureName(feature, info), 'popup-title'), node('div', info.id, 'popup-source'));
      if (sourceId(feature)) box.append(node('div', `來源物件：${sourceId(feature)}`, 'popup-row'));
      if (station.name) box.append(node('div', `車站：${station.name}`, 'popup-row'));
      if (attractions.has(feature)) {
        box.classList.add('attraction-popup');
        const address = p.PostalAddress || {};
        const addressText = [address.City, address.Town, address.StreetAddress]
          .filter(value => typeof value === 'string' && value.trim()).join('');
        const admission = p.IsAccessibleForFree === 1 ? '免費入場'
          : p.IsAccessibleForFree === 0 ? '需入場相關費用' : '未提供';
        box.append(node('div', '分類：景點', 'popup-row'),
          node('div', `地址：${addressText || '未提供'}`, 'popup-row'),
          node('div', `開放時間：${p.ServiceTimeInfo || '未提供'}`, 'popup-row'),
          node('div', `入場：${admission}`, 'popup-row'),
          node('div', `費用說明：${p.FeeInfo || '未提供'}`, 'popup-row'));
      } else if (nightMarkets.has(feature)) {
        box.append(node('div', '分類：夜市', 'popup-row'));
        if (p.opening_hours_text) {
          const status = { official: '政府網站資料', reported: '非官方報導，現況待確認',
            needs_review: '待確認', not_found: '未查得可確認時段',
            suspension_reported: '曾公告暫停營業，現況待確認' };
          box.append(node('div', `營業時間：${p.opening_hours_text}`, 'popup-row'));
          if (status[p.opening_hours_status]) box.append(node('div', status[p.opening_hours_status], 'popup-row'));
          if (p.opening_hours_note) box.append(node('div', p.opening_hours_note, 'popup-row'));
          for (const source of p.opening_hours_sources || []) {
            if (!/^https?:\/\//i.test(source.url || '')) continue;
            const row = node('div', '查詢來源：', 'popup-row'), link = node('a', source.title);
            link.href = source.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
            row.append(link); box.append(row);
          }
          if (p.opening_hours_checked_on) box.append(node('div', `查詢日期：${p.opening_hours_checked_on}`, 'popup-row'));
        }
        const walk = walkingById.get(sourceId(feature));
        if (walk) {
          appendWalkingDetails(box, walk);
          if (showWalking) {
            const show = node('button', '顯示步行路徑', 'walk-button'); show.type = 'button';
            show.addEventListener('click', () => showWalking(walk));
            const hide = node('button', '隱藏步行路徑', 'walk-button'); hide.type = 'button';
            hide.addEventListener('click', () => showWalking(walk, false));
            box.append(show, hide);
          }
        } else box.append(node('div', walkingStatus || (calculatedWalkingOrigins.has(sourceId(feature))
          ? '20 分鐘步行範圍內沒有捷運站。' : '此夜市尚無步行計算結果。'), 'popup-row'));
      } else if (exitGroup(feature)) {
        box.append(node('div', `分類：${exitNames[exitGroup(feature)]}`, 'popup-row'));
        if (exitGroup(feature) === 'mrt_exits') {
          if (!station.name) box.append(node('div', '所屬車站：來源未提供車站對照；請核對原始名稱。', 'popup-row'));
          if (station.lines.length) box.append(node('div', `所屬路線：${station.lines.map(line => line.name).join('、')}`, 'popup-row'));
          if (!p.ref) box.append(node('div', '出口編號：ref 欄位未提供；原始名稱可能包含編號。', 'popup-row'));
        } else box.append(node('div', '所屬路線：A 機場捷運', 'popup-row'));
      } else if (station.lines.length) {
        box.append(node('div', '所屬路線（依現有資料）', 'popup-row'));
        const badges = node('div', undefined, 'line-badges');
        for (const line of station.lines) {
          const badge = node('span', `${line.id} ${line.name}`, 'line-badge');
          badge.style.setProperty('--line-color', routeColors[line.id] || unknownColor);
          badges.append(badge);
        }
        box.append(badges);
      } else {
        box.append(node('div', '未分類：來源缺少可辨識的站碼或所屬路線。', 'popup-row'));
        if (isStation(feature) && !station.name) box.append(node('div', '來源也未提供站名，保留原始資料供核對。', 'popup-row'));
      }
      if (p['@geometry'] === 'center') {
        box.append(node('div', '座標為原始物件匯出的範圍中心。', 'popup-row'));
      }
      const fields = { ref: exitGroup(feature) ? '出口編號' : isStation(feature) ? '車站代碼' : '來源代碼',
        StationID: '車站代碼', station_ref: '車站代碼', ExitID: '出口代碼', ExitName_zh: '出口名稱',
        coordinate_source: '座標來源', coordinate_verified_on: '座標確認日期', coordinate_note: '座標備註',
        LocationDescription: '位置說明', Stair: '樓梯', Escalator: '電扶梯（來源值）', Elevator: '電梯',
        from: '路線起點', to: '路線終點', direction: '方向（來源標記）',
        operator: '營運單位（來源標記）', 'addr:full': '地址', wheelchair: '輪椅通行（來源標記）',
        access: '通行限制', network: '路網', service: '軌道用途', construction: '施工標記', UpdateTime: '資料更新時間',
        opening_hours: '營業時間（來源標記）', description: '說明', phone: '電話', branch: '分區',
        amenity: '設施類型（來源標記）', highway: '道路／站點類型（來源標記）' };
      for (const [key, label] of Object.entries(fields)) {
        if (key === 'opening_hours' && nightMarkets.has(feature) && p.opening_hours_text) continue;
        if (p[key] !== undefined && p[key] !== null) box.append(node('div', `${label}：${displayValue(p[key])}`, 'popup-row'));
      }
      if (!isStation(feature) && linkedStation(feature)?.name) {
        box.append(node('div', `車站代碼：${station.codes.join('、')}（依相同來源節點 ID 對照）`, 'popup-row'));
      } else if (isStop(feature)) box.append(node('div', '這是路線停靠位置；來源未提供此點的站名或站碼。', 'popup-row'));
      const memberships = routeMemberships(feature);
      if (memberships.length) {
        box.append(node('div', '所屬方向路線', 'popup-row'));
        for (const relation of memberships) {
          const tags = relation.reltags;
          const name = tags['name:zh-Hant'] || tags['name:zh'] || tags.name || `路線 ${relation.rel}`;
          box.append(node('div', name, 'popup-row'));
          const roles = { stop: '停靠點', stop_entry_only: '僅上車停靠點', stop_exit_only: '僅下車停靠點' };
          box.append(node('div', `節點／成員用途：${roles[relation.role] || relation.role || '來源未提供'}`, 'popup-row'));
          if (tags.from || tags.to) box.append(node('div', `${tags.from || '未提供起點'} → ${tags.to || '未提供終點'}`, 'popup-row'));
        }
      }
      if (feature.geometry.type === 'Point') {
        const [lon, lat] = feature.geometry.coordinates;
        box.append(node('div', `經緯度：${lat.toFixed(6)}, ${lon.toFixed(6)}`, 'popup-row'));
      }
      const details = node('details'), props = node('div', undefined, 'properties');
      details.append(node('summary', '查看全部來源欄位'));
      for (const [key, value] of Object.entries(p)) props.append(node('div', `${key}：${displayValue(value)}`, 'popup-row'));
      details.append(props); box.append(details);
      return box;
    }
    async function fetchJSON(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }
    function setupSidebar(map) {
      const sidebar = $('sidebar'), handle = $('sidebar-resizer'), toggle = $('sidebar-toggle');
      const mobile = matchMedia('(max-width: 700px)'), storageKey = 'mrt-map-sidebar';
      let settings = { width: 290, height: null, collapsed: false }, drag = null;
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (Number.isFinite(saved?.width)) settings.width = saved.width;
        if (Number.isFinite(saved?.height)) settings.height = saved.height;
        settings.collapsed = saved?.collapsed === true;
      } catch (_) { /* 瀏覽器不允許儲存時，仍可調整列表。 */ }
      const save = () => { try { localStorage.setItem(storageKey, JSON.stringify(settings)); } catch (_) {} };
      const limits = () => mobile.matches ? [120, Math.max(120, innerHeight - 188)]
        : [220, Math.max(220, Math.min(600, innerWidth - 328))];
      function update() {
        const [min, max] = limits(), axis = mobile.matches ? 'height' : 'width';
        const requested = settings[axis] ?? innerHeight * .36;
        const size = Math.round(Math.max(min, Math.min(max, requested)));
        document.body.style.setProperty(`--sidebar-${axis}`, `${size}px`);
        document.body.classList.toggle('sidebar-collapsed', settings.collapsed);
        sidebar.hidden = handle.hidden = settings.collapsed;
        toggle.textContent = settings.collapsed ? '展開列表' : '收合列表';
        toggle.setAttribute('aria-expanded', String(!settings.collapsed));
        handle.setAttribute('aria-orientation', mobile.matches ? 'horizontal' : 'vertical');
        handle.setAttribute('aria-valuemin', min); handle.setAttribute('aria-valuemax', max);
        handle.setAttribute('aria-valuenow', size);
        handle.setAttribute('aria-valuetext', `${mobile.matches ? '高度' : '寬度'} ${size} 像素`);
      }
      function finishDrag(event) {
        if (!drag || (event?.pointerId !== undefined && event.pointerId !== drag.id)) return;
        const id = drag.id; drag = null;
        if (handle.hasPointerCapture(id)) handle.releasePointerCapture(id);
        document.body.classList.remove('sidebar-resizing'); save();
      }
      handle.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.preventDefault(); handle.focus();
        const axis = mobile.matches ? 'height' : 'width';
        drag = { id: event.pointerId, axis, start: mobile.matches ? event.clientY : event.clientX,
          size: sidebar.getBoundingClientRect()[axis] };
        handle.setPointerCapture(event.pointerId); document.body.classList.add('sidebar-resizing');
      });
      handle.addEventListener('pointermove', event => {
        if (!drag || event.pointerId !== drag.id) return;
        const [min, max] = limits(), position = drag.axis === 'height' ? event.clientY : event.clientX;
        settings[drag.axis] = Math.max(min, Math.min(max, drag.size + position - drag.start)); update();
      });
      for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) handle.addEventListener(event, finishDrag);
      handle.addEventListener('dblclick', () => {
        settings[mobile.matches ? 'height' : 'width'] = mobile.matches ? null : 290; update(); save();
      });
      handle.addEventListener('keydown', event => {
        const [min, max] = limits(), axis = mobile.matches ? 'height' : 'width';
        const current = Number(handle.getAttribute('aria-valuenow'));
        const values = { Home: min, End: max,
          [mobile.matches ? 'ArrowUp' : 'ArrowLeft']: current - 20,
          [mobile.matches ? 'ArrowDown' : 'ArrowRight']: current + 20 };
        if (!(event.key in values)) return;
        event.preventDefault(); settings[axis] = Math.max(min, Math.min(max, values[event.key])); update(); save();
      });
      toggle.addEventListener('click', () => { finishDrag(); settings.collapsed = !settings.collapsed; update(); save(); });
      window.addEventListener('resize', () => { finishDrag(); update(); });
      let resizeFrame;
      new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => map.invalidateSize({ animate: false, debounceMoveend: true }));
      }).observe($('map'));
      update();
    }
    async function start() {
      if (location.protocol === 'file:') throw new Error('請執行 python mrt_map.py，透過終端機顯示的網址開啟地圖。');
      if (!window.L) throw new Error('無法載入地圖元件，請確認網路連線後重新整理。');
      const map = L.map('map', { zoomControl: false }).setView([25.04, 121.4], 10);
      setupSidebar(map);
      L.control.zoom({ position: 'topright' }).addTo(map);
      L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map);
      map.createPane('points').style.zIndex = 450;
      map.createPane('stations').style.zIndex = 470;
      map.createPane('markets').style.zIndex = 480;
      map.createPane('attractions').style.zIndex = 485;
      map.createPane('exits').style.zIndex = 490;
      map.createPane('walking').style.zIndex = 460;
      const walkingEntries = new Map();
      function showWalking(walk, visible = true) {
        const entry = walkingEntries.get(walk.market_id);
        if (!entry) return;
        entry.visible = visible;
        syncVisibility();
        if (visible) map.fitBounds(entry.layer.getBounds(), { padding: [45, 45], maxZoom: 17 });
      }
      map.attributionControl.addAttribution('步行路徑：<a href="https://valhalla.github.io/valhalla/">Valhalla</a> / <a href="https://www.fossgis.de/">FOSSGIS</a> · <a href="https://www.openstreetmap.org/">修正地圖</a>');
      map.createPane('routes').style.zIndex = 410;
      let tileFailed = false;
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).on('tileerror', () => {
        tileFailed = true; $('notice').hidden = false;
        $('notice').textContent = '街道底圖載入失敗，請檢查網路連線；資料圖層仍可查看。';
      }).addTo(map);
      const { layers } = await fetchJSON('/layers.json');
      try {
        const walks = await fetchJSON('/night-market-walks.json');
        walkingById.clear();
        calculatedWalkingOrigins.clear();
        for (const id of walks.calculated_market_ids || []) calculatedWalkingOrigins.add(id);
        for (const walk of walks.results) walkingById.set(walk.market_id, walk);
        walkingStatus = walks.status;
      } catch (_) { walkingStatus = '步行資料無法載入。'; }
      const loaded = await Promise.all(layers.map(async info => {
        if (info.error) return { info };
        try { return { info, data: await fetchJSON(info.url) }; }
        catch (error) { return { info: { ...info, error: `載入失敗：${error.message}` } }; }
      }));
      const stationFeatures = loaded.flatMap(({ data }) => (data?.features || []).filter(isStation));
      for (const { info, data } of loaded) {
        const filename = info.id.split('/').pop().toLowerCase();
        const group = { 'mrt_exits.geojson': 'mrt_exits', 'airport_mrt_exits.geojson': 'airport_exits' }[filename];
        if (group) for (const feature of data?.features || []) {
          exitGroups.set(feature, feature.properties?.transit_system === 'airport_mrt' ? 'airport_exits' : group);
        }
        if (filename === 'nightmarket.geojson') {
          for (const feature of data?.features || []) nightMarkets.add(feature);
        }
        if (filename === 'attractionlist_with_fee_and_hours.json') {
          for (const feature of data?.features || []) attractions.add(feature);
        }
      }
      stationById.clear();
      for (const { data } of loaded) {
        for (const feature of data?.features || []) {
          if (isStation(feature) && sourceId(feature)) stationById.set(sourceId(feature), stationDetails(feature));
        }
      }
      const entries = [], stationMarkers = [], allBounds = L.latLngBounds();
      const controls = new Map(), masterControls = {};
      function syncLabels() {
        for (const marker of stationMarkers) {
          if (map.getZoom() >= 14 && map.hasLayer(marker)) marker.openTooltip();
          else marker.closeTooltip();
        }
      }
      map.on('zoomend', syncLabels);
      for (const { info, data } of loaded) {
        if (!data) continue;
        const group = L.geoJSON(data, {
          style: feature => {
            if (['Point', 'MultiPoint'].includes(feature.geometry.type)) return {};
            if (nightMarkets.has(feature)) return { color: marketColors.night_markets,
              weight: 3, opacity: 1, fillOpacity: .2, className: 'market-shape' };
            if (isRoute(feature)) return { pane: 'routes', color: routeColor(feature), weight: 7,
              opacity: 1, className: 'data-shape route-shape' };
            const p = feature.properties || {};
            return { color: routeColor(feature), weight: p.service ? 2 : 4,
              opacity: 1, fillOpacity: .17, dashArray: p.service ? '5 5' : null, className: 'data-shape' };
          },
          pointToLayer: (feature, latlng) => {
            if (attractions.has(feature)) return L.circleMarker(latlng, { pane: 'attractions',
              radius: 8, color: '#fff', weight: 2,
              fillColor: attractionColors.attractions, fillOpacity: 1, className: 'attraction-point' });
            if (exitGroup(feature)) return L.circleMarker(latlng, { pane: 'exits',
              radius: 5, color: '#fff', weight: 1.5, fillColor: exitColors[exitGroup(feature)],
              fillOpacity: 1, className: `exit-point ${exitGroup(feature)}-point` });
            if (nightMarkets.has(feature)) return L.circleMarker(latlng, { pane: 'markets',
              radius: 8, color: '#fff', weight: 2,
              fillColor: marketColors.night_markets, fillOpacity: 1, className: 'night-market-point' });
            if (isStation(feature)) {
              return L.circleMarker(latlng, { pane: 'stations', radius: 8, weight: 3,
                color: pointColor(feature),
                fillColor: '#fff', fillOpacity: 1, className: 'station-point' });
            }
            return L.circleMarker(latlng, { pane: 'points', radius: isStop(feature) ? 4 : 6,
              color: '#fff', weight: 1.5, fillColor: pointColor(feature), fillOpacity: 1,
              className: isStop(feature) ? 'data-point stop-point' : 'data-point' });
          },
          onEachFeature: (feature, layer) => {
            if (isRoute(feature) && layer.setLatLngs) {
              const geometry = trimRouteGeometry(feature, stationFeatures);
              layer.setLatLngs(L.GeoJSON.coordsToLatLngs(geometry.coordinates, geometry.type === 'MultiLineString' ? 1 : 0));
            }
            layer.bindPopup(popup(feature, info, stationInfo(feature), showWalking),
              { maxWidth: 330, maxHeight: 300, keepInView: true });
            if (exitGroup(feature)) layer.bindTooltip(node('span', featureName(feature, info)),
              { direction: 'top', offset: [0, -5] });
            if (isStation(feature) || nightMarkets.has(feature) || attractions.has(feature)) {
              layer.bindTooltip(node('span', [featureName(feature, info), feature.properties.ref].filter(Boolean).join(' · ')),
                { permanent: true, direction: 'right', offset: [10, 0], className: 'station-label' });
              stationMarkers.push(layer);
            }
            entries.push({ layer, ids: displayLineIds(feature),
              kind: ['Point', 'MultiPoint'].includes(feature.geometry.type) ? 'points' : 'routes' });
          }
        });
        if (group.getBounds().isValid()) allBounds.extend(group.getBounds());
      }
      const marketById = new Map(loaded.flatMap(({ data }) => (data?.features || [])
        .filter(feature => nightMarkets.has(feature)).map(feature => [sourceId(feature), feature])));
      for (const walk of walkingById.values()) {
        const market = marketById.get(walk.market_id);
        const marketName = market ? featureName(market) : walk.market_id;
        const layer = L.geoJSON(walk.geometry, { style: { pane: 'walking', color: walkingColor,
          weight: 5, opacity: 1, dashArray: '8 6', className: 'walking-route' } });
        const box = node('div');
        box.append(node('div', `${marketName} → ${walk.station_name}`, 'popup-title'));
        appendWalkingDetails(box, walk);
        const focus = node('button', '查看完整路徑', 'walk-button'); focus.type = 'button';
        focus.addEventListener('click', () => showWalking(walk)); box.append(focus);
        layer.bindPopup(box, { maxWidth: 330, maxHeight: 300 });
        layer.bindTooltip(node('span', `${marketName} → ${walk.station_name} · ${walk.distance_m.toLocaleString()} 公尺`));
        const entry = { layer, ids: ['walking_routes'], kind: 'routes', visible: true };
        walkingEntries.set(walk.market_id, entry); entries.push(entry);
        if (layer.getBounds().isValid()) allBounds.extend(layer.getBounds());
      }
      $('walking-hint').textContent = walkingStatus || (walkingEntries.size
        ? `桃紅色虛線為夜市到捷運站的步行路徑，共 ${walkingEntries.size} 條（20 分鐘內）。點線可看距離與時間，終點尚未指定出口。`
        : '目前沒有 20 分鐘內的步行路徑可顯示。');
      function syncVisibility() {
        for (const entry of entries) {
          const visible = entry.ids.includes('walking_routes') ? entry.visible
            : entry.ids.some(id => controls.get(id)?.[entry.kind]?.checked);
          if (visible && !map.hasLayer(entry.layer)) entry.layer.addTo(map);
          else if (!visible && map.hasLayer(entry.layer)) map.removeLayer(entry.layer);
        }
        const walkingBox = controls.get('walking_routes')?.routes;
        if (walkingBox) {
          const count = [...walkingEntries.values()].filter(entry => entry.visible).length;
          walkingBox.checked = count > 0 && count === walkingEntries.size;
          walkingBox.indeterminate = count > 0 && count < walkingEntries.size;
        }
        for (const kind of ['points', 'routes']) {
          const boxes = [...controls.values()].map(row => row[kind]).filter(box => !box.disabled);
          const checked = boxes.filter(box => box.checked).length;
          const partial = boxes.some(box => box.indeterminate);
          masterControls[kind].checked = boxes.length > 0 && checked === boxes.length && !partial;
          masterControls[kind].indeterminate = partial || (checked > 0 && checked < boxes.length);
          masterControls[kind].disabled = !boxes.length;
        }
        syncLabels();
      }
      function addRow(id, name, master = false) {
        const row = node('tr'), heading = node('th'), title = node('span', undefined, 'line-name');
        heading.scope = 'row';
        if (master) row.className = 'all-row';
        else {
          const swatch = node('span', undefined, 'swatch');
          swatch.style.background = id === 'walking_routes' ? walkingColor
            : routeColors[id] || marketColors[id] || attractionColors[id] || exitColors[id] || unknownColor; title.append(swatch);
        }
        title.append(node('span', name)); heading.append(title); row.append(heading);
        const boxes = {};
        for (const [kind, label] of [['points', '站點'], ['routes', '路線']]) {
          const cell = node('td'), box = node('input'); box.type = 'checkbox';
          box.dataset.line = id; box.dataset.kind = kind;
          box.setAttribute('aria-label', `${name}：顯示${label}`);
          box.disabled = !master && !entries.some(entry => entry.kind === kind && entry.ids.includes(id));
          box.checked = !box.disabled; boxes[kind] = box; cell.append(box); row.append(cell);
          box.addEventListener('change', () => {
            if (master) for (const control of controls.values()) if (!control[kind].disabled) control[kind].checked = box.checked;
            if (kind === 'routes' && (master || id === 'walking_routes')) {
              for (const entry of walkingEntries.values()) entry.visible = box.checked;
            }
            syncVisibility();
          });
        }
        $('visibility-controls').append(row);
        if (master) Object.assign(masterControls, boxes);
        else controls.set(id, boxes);
      }
      addRow('all', '全部', true);
      const present = new Set(entries.flatMap(entry => entry.ids));
      for (const id of ['BR', 'R', 'R22A', 'G', 'G03A', 'O', 'BL', 'Y', 'LB', 'A', 'mrt_exits', 'airport_exits', 'night_markets', 'attractions', 'other']) {
        if (present.has(id)) addRow(id, routeNames[id] || marketNames[id] || attractionNames[id] || exitNames[id] || '未分類');
      }
      addRow('walking_routes', '夜市步行路徑');
      syncVisibility();
      if (allBounds.isValid()) map.fitBounds(allBounds, { padding: [30, 30], animate: false });
      syncLabels();
      const failures = loaded.filter(item => item.info.error);
      const skipped = loaded.filter(({ info }) => info.missing_geometry || info.invalid_geometry);
      if (failures.length) {
        $('notice').hidden = false;
        $('notice').textContent = failures.map(item => `${item.info.name}：${item.info.error}`).join('；');
      } else if (!entries.length) {
        $('notice').hidden = false; $('notice').textContent = '沒有可顯示的資料，請確認 data 資料夾後重新啟動程式。';
      } else if (skipped.length && !tileFailed) {
        $('notice').hidden = false;
        $('notice').textContent = skipped.map(({ info }) =>
          `${info.name}：${info.missing_geometry} 筆缺少座標、${info.invalid_geometry} 筆資料無效，未顯示。`).join('；');
      } else if (!tileFailed) $('notice').hidden = true;
      document.body.dataset.ready = 'true';
    }
    start().catch(error => { $('notice').hidden = false; $('notice').textContent = `地圖載入失敗：${error.message}`; });
  </script>
</body>
